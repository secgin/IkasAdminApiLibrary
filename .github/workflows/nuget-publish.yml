name: Publish NuGet

on:
  push:
    tags:
      - 'v*'
      - 'V*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Resolve package version from tag
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          VERSION="${VERSION#V}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid NuGet version tag: $TAG_NAME"
            echo "Use tags like v2.0.0 or v2.0.0-beta.1"
            exit 1
          fi

          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved package version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore IkasAdminApiLibrary.csproj

      - name: Build
        run: dotnet build IkasAdminApiLibrary.csproj --configuration Release --no-restore /p:PackageVersion=$PACKAGE_VERSION /p:Version=$PACKAGE_VERSION /p:GeneratePackageOnBuild=false

      - name: Pack
        run: dotnet pack IkasAdminApiLibrary.csproj --configuration Release --no-build --output bin/Release /p:PackageVersion=$PACKAGE_VERSION /p:Version=$PACKAGE_VERSION

      - name: Push to NuGet
        run: dotnet nuget push bin/Release/IkasAdminApiLibrary.$PACKAGE_VERSION.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
